name: Nightly

# The counterpart to ci.yml. That workflow gates every push and keeps itself
# narrow on purpose: the node's and the NTS server's own tests, and one start.
# This one asks the two questions a gate should not be asked.
#
# The first is wider: every test of every library in this solution, at the
# gitlinks this repository pins. Each library gates its own tests in its own
# repository, but nobody there tests this combination of them — Hermod's suite
# against this Styx, Norn's against this Hermod, WWCP_Node's against this Norn,
# in one process.
#
# The second is the opposite of pinning: the submodules moved to their tips, to
# find out whether advancing the gitlinks would work before somebody advances
# them.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without any repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:23 UTC, after the libraries of this stack have run theirs - Hermod
    # and Urdr at 02:17, WWCP_Node at 02:47 - so that a morning is read in the
    # order the dependencies are stacked: if a library went red in the night,
    # this night's red is already explained. Not on the hour, because GitHub's
    # scheduler is busiest then and delays runs by tens of minutes; and on a
    # minute no other program of the family has taken.
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # Everything, at the pinned gitlinks. Same two legs as ci.yml — see there for
  # why it is exactly Windows and a debian:13 container, why there is no
  # schema job before it, and why Node is needed on both.
  # ---------------------------------------------------------------------------
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:

      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 openssl tzdata xz-utils && git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Build
        run: dotnet build NTSServerCLI.slnx --configuration Release

      # Every test project in the solution, which is what makes this different
      # from the gate: NTSServerTests and WWCP_Node_Tests plus Styx, Hermod,
      # Norn and Urdr, all against each other at the versions pinned here.
      #
      # Three categories left out, and they are somebody else's decision rather
      # than ours: Hermod marks its live DNS probes "LiveDNS", Norn marks its
      # real NTS-KE and NTP handshakes "External" and "LiveNetwork". All of them
      # query Cloudflare, Google, PTB and Netnod for real. A hosted runner is
      # not a normal client — datacentre egress on UDP/53 and UDP/123 is
      # commonly blocked or rate-limited — so they would fail here for reasons
      # that say nothing about any of this code. Their own repositories run them
      # where that has been thought through; this night does not pretend to.
      #
      # One TRX file per test project. LogFilePrefix names each after the leg,
      # the framework and a time stamp, which the logger moves on by a second
      # while that name is taken, so the names are not finishing times.
      # LogFileName would give all six projects the same file, each overwriting
      # the one before, and the artifact would hold only the one that finished
      # last.
      #
      # Fatal, unlike the two steps further down: a red here is a real
      # regression in a combination this repository is responsible for.
      #
      # --blame-hang: a test that has not finished after 15 minutes is a hang,
      # not a slow test - none takes more than seconds. Its test host is dumped
      # (mini: thread stacks, a few MB on Windows, some 20-40 on Debian) and
      # stopped, the step goes red and the console names the test, instead of
      # waiting for the 120 minutes without a word. The TRX of that project
      # holds only the tests that finished; the hung one is in the blame's
      # Sequence file, marked Completed="False".
      #
      # --blame-crash: a test host that dies is dumped as it dies (mini again),
      # beside the Sequence file. The test named is only the one that was
      # running, so the dump is what there is to go on.
      #
      # The same as LocalControllerCLI's night, where both were added after a
      # hang and a crash in Hermod's suite.
      - name: Test everything, as pinned
        timeout-minutes: 120
        run: dotnet test NTSServerCLI.slnx --configuration Release --no-build --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini --filter "TestCategory!=LiveDNS&TestCategory!=External&TestCategory!=LiveNetwork" --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=${{ matrix.leg }}" --results-directory artifacts

      # The same start as in ci.yml, for the same reason and on the same leg -
      # see there for the ports and the five questions. Repeating it costs a
      # minute and catches the kind of failure that only shows up when nobody
      # pushed: a dependency resolved at restore time that moved, a container
      # image whose OpenSSL changed. !cancelled(), because a red suite above
      # says nothing about whether the thing still starts.
      - name: The NTS server starts and answers (Debian)
        if: ${{ matrix.leg == 'debian-13-container' && !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -u
          tmp="$(mktemp -d)"
          dotnet NTSServerCLI/bin/Release/net10.0/NTSServerCLI.dll \
              --port        18361 \
              --ssh-port    22124 \
              --ntske-port  14460 \
              --ntp-port    11123 \
              --hostname    localhost \
              --accounts    "$tmp/accounts" \
              --config      "$tmp/configuration.json" \
              --log-file    "$tmp/logs" \
              < /dev/null > "$tmp/console.log" 2>&1 &
          pid=$!

          root=000
          for _ in $(seq 1 60); do
              root="$(curl -sS -o "$tmp/index.html" -w '%{http_code}' http://127.0.0.1:18361/ 2>/dev/null || true)"
              root="${root:-000}"
              if [ "$root" != 000 ]; then
                  break
              fi
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
          done

          api="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18361/api/v1/ntsServer 2>/dev/null || true)"
          api="${api:-000}"

          ssh_banner="$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/22124 && head -n 1 <&3' 2>/dev/null | tr -d '\r' || true)"

          ntske="$(timeout 10 openssl s_client -connect 127.0.0.1:14460 -servername localhost -tls1_3 -alpn ntske/1 < /dev/null 2>&1 || true)"
          ntske_version="$(printf '%s\n' "$ntske" | sed -n 's/^New, \(TLSv[0-9.]*\), .*/\1/p' | head -n 1)"
          ntske_alpn="$(printf '%s\n' "$ntske" | sed -n 's/^ALPN protocol: //p' | head -n 1)"

          printf '\043' > "$tmp/ntp-request"
          head -c 47 /dev/zero >> "$tmp/ntp-request"
          ntp="$(timeout 5 bash -c 'exec 3<>/dev/udp/127.0.0.1/11123 && cat "$1" >&3 && head -c 48 <&3' _ "$tmp/ntp-request" 2>/dev/null | od -An -tx1 -N2 | tr -d ' \n' || true)"

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          echo "GET /                 -> $root"
          echo "GET /api/v1/ntsServer -> $api"
          echo "SSH 22124             -> ${ssh_banner:-nothing}"
          echo "NTS-KE 14460          -> ${ntske_version:-no TLS}, ALPN ${ntske_alpn:-none}"
          echo "NTP 11123             -> ${ntp:-nothing}"

          awk '/^  built from/ { f = 1 } f && !/^  built from/ && !/^                 / { f = 0 } f' "$tmp/console.log" || true

          fault=0
          if [ "$root" != 200 ]; then
              echo "The web interface did not answer."
              fault=1
          elif ! grep -q "<title>NTS Server</title>" "$tmp/index.html"; then
              echo "Something answered, but it is not the embedded web interface."
              fault=1
          fi
          if [ "$api" != 401 ]; then
              echo "The JSON API answered $api where 401 was expected: it is supposed to be shut to anyone not signed in."
              fault=1
          fi
          case "$ssh_banner" in
              SSH-2.0-*) ;;
              *) echo "The SSH server did not answer on 22124."
                 fault=1 ;;
          esac
          if [ "$ntske_version" != TLSv1.3 ] || [ "$ntske_alpn" != ntske/1 ]; then
              echo "NTS-KE on 14460 did not agree to TLS 1.3 with the ALPN ntske/1. What openssl said:"
              printf '%s\n' "$ntske" | grep -v -e '^[A-Za-z0-9+/=]\{64\}$' | head -40
              fault=1
          fi
          if [ "$ntp" != 2401 ]; then
              echo "NTP on 11123 did not answer as a synchronized stratum-1 server (expected 2401, the first byte and the stratum)."
              fault=1
          fi

          if [ "$fault" != 0 ]; then
              echo
              if kill -0 "$pid" 2>/dev/null; then
                  echo "It was still running when it was asked."
              else
                  echo "It was no longer running when it was asked."
              fi
              echo "What it said, without the first-start password:"
              grep -v -i password "$tmp/console.log" || echo "(nothing at all)"
              exit 1
          fi

      # The NuGet packages of the whole solution, transitives included. One leg,
      # because this is a property of the dependency graph and not of the
      # operating system; printing it on both would only make a night look like
      # it had found two of everything.
      #
      # Informational, and that is the part worth insisting on: an advisory
      # published overnight is news about the world, not a regression here — the
      # same commit that was green yesterday is affected today without a line
      # having changed. That is also why it lives in the night and not in the
      # gate: a gate that can go red for something no push caused stops being
      # read as a gate.
      - name: Known vulnerabilities (informational)
        if: ${{ matrix.leg == 'debian-13-container' && !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo '## Known vulnerabilities (informational)'
            echo
            echo 'Every project of the solution, transitive packages included.'
            echo 'Informational: an advisory published overnight is news, not a'
            echo 'regression, so this step cannot turn the night red.'
            echo
            echo '```'
            dotnet list NTSServerCLI.slnx package --vulnerable --include-transitive 2>&1 \
              | grep -v "has no vulnerable packages given the current sources" \
              | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          # The blame's files sit one directory down, in a GUID-named one; vstest
          # leaves copies of them further down still, which are left out.
          path: |
            artifacts/*.trx
            artifacts/*/Sequence_*.xml
            artifacts/*/*_hangdump.dmp
            artifacts/*/*_crashdump.dmp


  # ---------------------------------------------------------------------------
  # The other question: what would happen if the gitlinks were advanced today?
  #
  # This repository pins, which is right for something that is deployed — but
  # it means an upstream change is invisible here until somebody advances a
  # gitlink and finds out by hand. That is exactly what this job does instead,
  # every night and without changing anything.
  #
  # Informational throughout. A red here is news about a library, not a
  # regression in this repository: the pinned combination is what CI gates, and
  # it is unaffected. What this is for is the morning before the gitlinks move.
  #
  # One leg, because "does the new Norn still compile against this NTS server"
  # is not a question about the operating system.
  # ---------------------------------------------------------------------------
  submodules-at-their-tips:
    runs-on: ubuntu-latest
    container: debian:13
    steps:

      - name: Install prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata xz-utils && git config --global --add safe.directory '*'

      # Full history rather than the usual shallow one: counting how far each
      # submodule has moved needs the commits in between to exist.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # git submodule status prints "<sha> <path> (<describe>)", the sha carrying
      # a leading + or - when the checkout does not match the pin. Remembered
      # before anything moves, so that afterwards each one can be asked how far
      # it went.
      #
      # --remote is what makes this a different question from a plain update: it
      # ignores the sha recorded here and takes the tip of the submodule's
      # remote HEAD, which for all of these is master. Not --recursive: none of
      # them has submodules of its own.
      - name: Move every submodule to its tip
        shell: bash
        run: |
          git submodule status | awk '{ print $2, $1 }' > "$RUNNER_TEMP/pinned.txt"
          git submodule update --remote
          {
            echo '## The submodules at their tips'
            echo
            echo 'What has happened upstream since the gitlinks here were last advanced.'
            echo
            echo '```'
            while read -r path sha; do
              sha="${sha#[+-]}"
              ahead="$(git -C "$path" rev-list --count "$sha"..HEAD 2>/dev/null || echo '?')"
              printf '%-26s %4s commit(s) ahead   %s\n' "$path" "$ahead" "$(git -C "$path" rev-parse HEAD)"
            done < "$RUNNER_TEMP/pinned.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build against the tips (informational)
        id: build
        continue-on-error: true
        run: dotnet build NTSServerCLI.slnx --configuration Release

      # --blame-hang and --blame-crash as in "Test everything, as pinned": a
      # hang is named after 15 minutes, a crash as it happens. Nothing is
      # uploaded from this job, so the name in the console is what is kept.
      - name: Test against the tips (informational)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 120
        run: dotnet test NTSServerCLI.slnx --configuration Release --no-build --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini --filter "TestCategory!=LiveDNS&TestCategory!=External&TestCategory!=LiveNetwork" --logger "console;verbosity=normal"

      - name: Say how it went
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo
            echo "Build against the tips: ${{ steps.build.outcome }}"
            echo
            echo 'Informational. The gitlinks in this repository are unchanged and'
            echo 'CI gates them as they are; this only says what advancing them'
            echo 'would cost today.'
          } >> "$GITHUB_STEP_SUMMARY"
